<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linux Remote Control</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 24px;
      padding: 28px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .status-badge.online { background-color: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); }
    .status-badge.offline { background-color: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .online .dot { background-color: #3fb950; box-shadow: 0 0 8px #3fb950; }
    .offline .dot { background-color: #f85149; }

    h1 { font-size: 22px; margin-bottom: 20px; color: #f0f6fc; }
    
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #8b949e;
      text-align: left;
      margin: 18px 0 8px 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .btn {
      background: #21262d;
      border: 1px solid #363b42;
      color: #f0f6fc;
      padding: 18px 12px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn.danger { border-color: rgba(248, 81, 73, 0.4); }
    .btn.danger:active:not(:disabled) { background: rgba(248, 81, 73, 0.15); }
    .btn span { font-size: 26px; }
    .btn:active:not(:disabled) { transform: scale(0.95); background: #30363d; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; border-color: transparent; }

    /* Volume Slider */
    .volume-card {
      background: #21262d;
      border: 1px solid #363b42;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }
    .volume-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; color: #f0f6fc; }
    .volume-slider { width: 100%; accent-color: #238636; height: 6px; cursor: pointer; }

    /* Popup Message Card */
    .message-card {
      background: #21262d;
      border: 1px solid #363b42;
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message-input-group { display: flex; gap: 8px; }
    .message-input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #363b42;
      border-radius: 12px;
      padding: 12px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    .message-input:focus { border-color: #238636; }
    .send-btn {
      background: #238636;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .send-btn:active:not(:disabled) { background: #2ea043; }
    .send-btn:disabled, .message-input:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Modal Overlay Styles */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-overlay img { max-width: 100%; max-height: 75vh; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid #30363d; }
    .close-btn { margin-top: 20px; background: #238636; color: #ffffff; border: none; padding: 12px 28px; border-radius: 20px; font-size: 16px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <!-- POP-UP MODAL FOR SCREENSHOT -->
  <div class="modal-overlay" id="screenshot-modal">
    <img id="screenshot-img" src="" alt="Live Screenshot">
    <button class="close-btn" id="close-btn">Close Capture</button>
  </div>

  <div class="container">
    <div id="status-badge" class="status-badge offline">
      <span class="dot"></span>
      <span id="status-text">CONNECTING...</span>
    </div>

    <h1>Control Center</h1>

    <div class="section-title">Actions</div>
    <div class="grid">
      <button class="btn" id="btn-screenshot" disabled><span>📸</span> Screenshot</button>
      <button class="btn" id="btn-lock" disabled><span>🔒</span> Lock Screen</button>
      <button class="btn" id="btn-mute" disabled><span>🔇</span> Toggle Mute</button>
      <button class="btn" id="btn-browser" disabled><span>🦊</span> Open Firefox</button>
    </div>

    <!-- VOLUME SLIDER MODULE -->
    <div class="volume-card">
      <div class="volume-header">
        <span>🔊 Volume</span>
        <span id="volume-val">50%</span>
      </div>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="50" disabled>
    </div>

    <!-- POPUP MESSAGE MODULE -->
    <div class="message-card">
      <div class="section-title" style="margin-top:0;">Send Screen Message</div>
      <div class="message-input-group">
        <input type="text" id="popup-input" class="message-input" placeholder="Type a message..." disabled>
        <button class="send-btn" id="btn-send-msg" disabled>Send</button>
      </div>
    </div>

    <div class="section-title">Power</div>
    <div class="grid">
      <button class="btn danger" id="btn-restart" disabled><span>🔄</span> Restart</button>
      <button class="btn danger" id="btn-shutdown" disabled><span>⏻</span> Shutdown</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCGMOrMCPO1lc7yjD_pbyLff75DCGphpaw",
      authDomain: "linux-remote-control.firebaseapp.com",
      databaseURL: "https://linux-remote-control-default-rtdb.firebaseio.com",
      projectId: "linux-remote-control",
      storageBucket: "linux-remote-control.firebasestorage.app",
      messagingSenderId: "613219845352",
      appId: "1:613219845352:web:95ee92e2df394513bdf55d",
      measurementId: "G-CTE6E1SWD9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const buttons = document.querySelectorAll('.btn');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeVal = document.getElementById('volume-val');
    
    // Popup Message Elements
    const popupInput = document.getElementById('popup-input');
    const sendMsgBtn = document.getElementById('btn-send-msg');

    const modal = document.getElementById('screenshot-modal');
    const screenshotImg = document.getElementById('screenshot-img');
    const closeBtn = document.getElementById('close-btn');

    let heartbeatTimer = null;

    // Monitor Online/Offline Status
    const statusRef = ref(db, '/device/status');
    onValue(statusRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.last_seen) {
        checkStatus(data.last_seen);
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        heartbeatTimer = setInterval(() => checkStatus(data.last_seen), 1000);
      } else {
        setOffline();
      }
    });

    function checkStatus(lastSeenTimestamp) {
      const currentSeconds = Math.floor(Date.now() / 1000);
      if (currentSeconds - lastSeenTimestamp <= 10) {
        setOnline();
      } else {
        setOffline();
      }
    }

    function setOnline() {
      statusBadge.className = 'status-badge online';
      statusText.textContent = 'COMPUTER ONLINE';
      buttons.forEach(btn => btn.disabled = false);
      volumeSlider.disabled = false;
      popupInput.disabled = false;
      sendMsgBtn.disabled = false;
    }

    function setOffline() {
      statusBadge.className = 'status-badge offline';
      statusText.textContent = 'OFFLINE COMPUTER';
      buttons.forEach(btn => btn.disabled = true);
      volumeSlider.disabled = true;
      popupInput.disabled = true;
      sendMsgBtn.disabled = true;
    }

    // Command Helper with Optional Confirmation
    function sendCommand(cmd, confirmMessage = null) {
      if (confirmMessage && !confirm(confirmMessage)) {
        return;
      }
      const commandRef = ref(db, '/device/command');
      set(commandRef, cmd);
    }

    // Volume Slider Handler
    volumeSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      volumeVal.textContent = val + '%';
    });

    volumeSlider.addEventListener('change', (e) => {
      const val = e.target.value;
      const volumeRef = ref(db, '/device/volume');
      set(volumeRef, val);
    });

    // Send Message Handler
    sendMsgBtn.addEventListener('click', () => {
      const text = popupInput.value.trim();
      if (text) {
        const messageRef = ref(db, '/device/popup_message');
        set(messageRef, text);
        popupInput.value = ''; // Clear input after sending
      }
    });

    popupInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMsgBtn.click();
      }
    });

    // Listen for Screenshot Updates
    const screenshotRef = ref(db, '/device/last_screenshot');
    onValue(screenshotRef, (snapshot) => {
      const imageDataUrl = snapshot.val();
      if (imageDataUrl) {
        screenshotImg.src = imageDataUrl;
        modal.classList.add('active');
      }
    });

    // Close Modal Button
    closeBtn.addEventListener('click', () => {
      modal.classList.remove('active');
      set(ref(db, '/device/last_screenshot'), null);
    });

    document.getElementById('btn-screenshot').addEventListener('click', () => sendCommand('screenshot'));
    document.getElementById('btn-lock').addEventListener('click', () => sendCommand('lock'));
    document.getElementById('btn-mute').addEventListener('click', () => sendCommand('mute'));
    document.getElementById('btn-browser').addEventListener('click', () => sendCommand('browser'));
    
    // Power Buttons with Safe Confirmations
    document.getElementById('btn-restart').addEventListener('click', () => sendCommand('restart', 'Are you sure you want to restart your computer?'));
    document.getElementById('btn-shutdown').addEventListener('click', () => sendCommand('shutdown', 'Are you sure you want to shut down your computer?'));
  </script>
</body>
</html>
